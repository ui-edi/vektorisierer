name: Android-App bauen

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'src/**'
      - 'vendor/**'
      - 'build.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.VK_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Seite bauen und in die App legen
        run: |
          python3 build.py
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          ls -la android/app/src/main/assets

      - name: KI-Modelle laden und prüfen
        # Offizielle ONNX-Dateien aus dem rembg-Projekt; die Prüfsummen verhindern, dass eine veränderte Datei in die App gelangt.
        #   u2net.onnx       – U²-Net (Apache 2.0), «KI Foto»
        #   isnet-anime.onnx – ISNet-Anime von SkyTNT (Apache 2.0), «KI Zeichnung»
        run: |
          set -euo pipefail
          D=android/app/src/main/assets/models
          mkdir -p "$D"
          BASE=https://github.com/danielgatis/rembg/releases/download/v0.0.0
          curl -fsSL --retry 3 -o "$D/u2net.onnx" "$BASE/u2net.onnx"
          curl -fsSL --retry 3 -o "$D/isnet-anime.onnx" "$BASE/isnet-anime.onnx"
          cat > "$RUNNER_TEMP/models.sha256" <<'SUMS'
          8d10d2f3bb75ae3b6d527c77944fc5e7dcd94b29809d47a739a7a728a912b491  android/app/src/main/assets/models/u2net.onnx
          f15622d853e8260172812b657053460e20806f04b9e05147d49af7bed31a6e99  android/app/src/main/assets/models/isnet-anime.onnx
          SUMS
          sed -i 's/^ *//' "$RUNNER_TEMP/models.sha256"
          sha256sum -c "$RUNNER_TEMP/models.sha256"
          ls -la "$D"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android-SDK 36 bereitstellen (auf GitHub vorinstalliert)
        working-directory: android
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK" > local.properties
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null || true
            "$SM" --install "platforms;android-36" "build-tools;35.0.0" > /dev/null || echo "Hinweis: SDK-Teile werden beim Bauen nachgeladen"
          fi

      - name: Signier-Schlüssel bereitstellen
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.VK_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/vektorisierer.jks"
          echo "VK_KEYSTORE=$RUNNER_TEMP/vektorisierer.jks" >> "$GITHUB_ENV"

      - name: App bauen
        working-directory: android
        env:
          VK_KEYSTORE_PASSWORD: ${{ secrets.VK_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: APK bereitlegen
        run: |
          mkdir -p out
          SUFFIX=""
          if [ "$HAS_KEY" != "true" ]; then SUFFIX="-testsignatur"; fi
          cp android/app/build/outputs/apk/release/app-release.apk "out/Vektorisierer-1.0.${{ github.run_number }}${SUFFIX}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Vektorisierer-1.0.${{ github.run_number }}
          path: out/
          retention-days: 30
